name = "campaign-loader"
compatibility_date = "2026-07-01"
main = "src/index.js"

# Proyecto destino. El de producción (BTL - Run ✉️, 1204870393367337)
# está en la lista SOLO_LECTURA de src/index.js: ahí no se escribe.
[vars]
ASANA_PROJECT_GID = "1218744348845656"   # SANDBOX Campaign Loader (borrar)
ASANA_WORKSPACE_GID = "8485243267402"

# El Worker sirve /public y además responde a /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# Las propuestas compartidas viven aquí. El principal se quedó sin este
# binding y por eso ningún enlace compartido funcionaba en él: la página
# cargaba, pero la propuesta "ya no existía". Es el mismo almacén que el
# entorno de pruebas, a propósito: un enlace tiene que abrirse desde
# cualquiera de los dos.
[[kv_namespaces]]
binding = "PROPUESTAS"
id = "7cf5033bb3c645abb171aebb6c15fac3"

# Secretos (nunca en este fichero):
#   npx wrangler secret put ASANA_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY

# Los prompts se importan como texto desde src/prompts/*.md
[[rules]]
type = "Text"
globs = ["**/*.md"]

# El entorno `pruebas` (campaign-loader-pruebas) fue un fork temporal para
# probar el emparejamiento con modelo sin tocar el Worker que usa la
# gente. Cumplió, y se retira: a partir de aquí solo hay un Worker.
#
# El proyecto de Asana NO cambia: se sigue escribiendo en el SANDBOX.
# El de producción (BTL - Run) está en SOLO_LECTURA en src/index.js.
