name = "campaign-loader"
compatibility_date = "2026-07-01"
main = "src/index.js"

# Proyecto destino. El de producción (BTL - Run ✉️, 1204870393367337)
# está en la lista SOLO_LECTURA de src/index.js: ahí no se escribe.
[vars]
ASANA_PROJECT_GID = "1218744348845656"   # SANDBOX Campaign Loader (borrar)
ASANA_WORKSPACE_GID = "8485243267402"

# El Worker sirve /public y además responde a /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# Secretos (nunca en este fichero):
#   npx wrangler secret put ASANA_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY

# Los prompts se importan como texto desde src/prompts/*.md
[[rules]]
type = "Text"
globs = ["**/*.md"]

# ── ENTORNO DE PRUEBAS ───────────────────────────────────────
# Worker aparte, con su propia URL y sus propios secretos, para
# probar el emparejamiento con modelo sin tocar el que usa la
# gente. Escribe en el mismo sandbox de Asana.
#
#   npx wrangler deploy --env pruebas
#   npx wrangler secret put ASANA_TOKEN --env pruebas
#   npx wrangler secret put ANTHROPIC_API_KEY --env pruebas
[env.pruebas]
name = "campaign-loader-pruebas"

[env.pruebas.vars]
ASANA_PROJECT_GID = "1218744348845656"
ASANA_WORKSPACE_GID = "8485243267402"

[env.pruebas.assets]
directory = "./public"
binding = "ASSETS"
