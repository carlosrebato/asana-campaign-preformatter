<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Loader · Movistar</title>
<link rel="stylesheet" href="app.css?v=cae0e96a69">
<link rel="icon" href="movistar-m-square.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="movistar-m-128.png" alt="Movistar">
      <div>
        <div class="brand-name">Campaign Loader</div>
        <div class="brand-sub">Marketing · Planificación mensual</div>
      </div>
    </div>
    <span class="chip-beta" title="En pruebas: los emparejamientos los propone un modelo y hay que revisarlos">Beta</span>
    <nav class="stepper" id="stepper"></nav>
  </div>
</header>

<div id="app"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="data.js?v=f72b0a1042"></script>
<script src="excel.js?v=c3685e933f"></script>
<script src="banners.js?v=c3f4afc339"></script>
<script src="estrategia.js?v=e4035e3db2"></script>
<script src="api.js?v=4b8dba6868"></script>
<script>
/* ============================================================
   Campaign Loader · App
   Estado en memoria. Sin localStorage (no soportado en artifacts
   ni necesario aquí). Edición inline = mutación local, 0 llamadas.
============================================================ */

const D = CATALOGS;

const S = {
  screen: 'entrada',          // entrada | procesando | revision | confirmar | resultado | error
  error: '',                  // por qué se paró el procesado, si se paró
  falloModelo: '',            // por qué no contestó el modelo, si no contestó
  files: { excel: null, banners: null, strategy: [] },  // varios documentos de estrategia
  // Todo lo que la pantalla de proceso necesita para contar qué pasa.
  // Tarda minutos: sin detalle real parece colgada.
  proc: { paso: 0, detalle: '', cuenta: '', hechas: 0, total: 0, inicio: 0, seg: 0 },
  tasks: [],
  dragId: null,
  dragOverSection: null,
  loading: false,
  loadProgress: [0, 0],
  result: null,
  dupes: [],
  dupesCuando: 0,          // cuándo se preguntó a Asana por última vez
  comprobando: false,
  reproduciendo: false,    // ?demo= · se reproduce una pasada grabada
  avisoExcel: '',          // un .xlsx que no es ninguno de los dos del mes
  renombradas: null,       // resultado del renombrado de la última carga
  filtro: 'todas',        // todas | revisar | sin | pendientes
  propuestaId: '',        // identificador del enlace compartido
  propuestaVer: 0,        // versión que tenemos de la propuesta
  copiado: false,         // acaba de copiarse el enlace
  tocadas: {},            // tareas cambiadas aquí, pendientes de guardar
  sincro: '',             // '', 'guardando', 'guardado', 'fuera'
  // null mientras se piden los catálogos: hasta que se sabe si Asana
  // responde no se avisa de nada, que si no el aviso parpadea al cargar.
  catalogos: null
};

const ICONS = {
  file: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  fileBig: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#38552B" stroke-width="3.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
  arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  grip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>',
  trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  chevR: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>',
  chevD: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E4A09" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  ok: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38552B" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
  fail: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B83227" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const secName = id => (D.sections.find(s => s.id === id) || {}).name || 'Otros';

/* ---------------- STEPPER ---------------- */
const STEPS = [
  { id: 'entrada',    label: 'Entrada' },
  { id: 'procesando', label: 'Procesado' },
  { id: 'revision',   label: 'Revisión' },
  { id: 'confirmar',  label: 'Carga en Asana' }
];

// A qué pasos se puede ir desde donde estamos. No es lineal: se vuelve
// atrás a corregir y se avanza a lo ya hecho. Lo que no se puede es
// saltar a un paso cuyo trabajo previo no existe todavía.
function pasoAccesible(id) {
  if (id === 'procesando') return false;          // no es una pantalla, es un tránsito
  if (id === 'entrada') return S.screen !== 'procesando';
  if (id === 'revision') return S.tasks.length > 0;
  if (id === 'confirmar') return S.tasks.some(t => t.approved);
  return false;
}

function renderStepper() {
  const cur = S.screen === 'resultado' ? 'confirmar' : S.screen;
  const i = STEPS.findIndex(s => s.id === cur);
  // Los pasos a los que se puede ir llevan data-paso y se marcan como
  // pulsables; el resto se queda apagado. Sin esa señal nadie descubre
  // que la barra sirve para moverse.
  document.getElementById('stepper').innerHTML = STEPS.map((s, n) => {
    const cls = n === i ? 'step active' : n < i ? 'step done' : 'step';
    const num = n < i ? ICONS.check : (n + 1);
    const ir = s.id !== cur && pasoAccesible(s.id);
    return `<div class="${cls}${ir ? ' step-ir' : ''}"${ir ? ` data-paso="${s.id}"` : ''}>`
      + `<span class="step-num">${num}</span><span class="step-label">${s.label}</span></div>`
      + (n < STEPS.length - 1 ? '<span class="step-sep">›</span>' : '');
  }).join('');
}

/* ---------------- 1 · ENTRADA ---------------- */
// Qué ha entendido el lector del Excel. Los avisos de TSK pendiente son
// normales (la mitad del fichero); se cuentan pero no se listan.
function resumenExcel(p) {
  const avisos = p.warnings.filter(w => w.tipo !== 'tsk');
  const sinTsk = p.warnings.length - avisos.length;
  return `
    <div class="drop-hint">${p.meta.filas} campañas${sinTsk ? ` · ${sinTsk} sin TSK` : ''}</div>
    ${Object.entries(p.meta.omitidas).map(([k, n]) =>
      `<div class="drop-hint">${n} de ${esc(k)} no se importan</div>`).join('')}
    ${avisos.length ? `<ul class="drop-avisos">${avisos.slice(0, 6).map(w =>
      `<li>Fila ${w.fila}: ${esc(w.msg)}</li>`).join('')}${avisos.length > 6 ? `<li>… y ${avisos.length - 6} más</li>` : ''}</ul>` : ''}`;
}

// Lo mismo para el fichero de banners. Aquí interesa decir dos números
// juntos: cuántas creatividades son nuevas (y por tanto tarea) y cuántas
// se reutilizan. Ver solo el primero no deja comprobar nada; verlos
// juntos sí, porque los dos suman las celdas escritas de la parrilla.
function resumenBanners(p) {
  const m = p.meta;
  return `
    <div class="drop-hint">${m.filas} banners nuevos${m.reutilizadas ? ` · ${m.reutilizadas} reutilizados` : ''}</div>
    ${m.posiciones?.length ? `<div class="drop-hint">${m.posiciones.length} posiciones · ${esc((m.semanas || []).join(' '))}</div>` : ''}
    ${p.warnings.length ? `<ul class="drop-avisos">${p.warnings.slice(0, 6).map(w =>
      `<li>${esc(w.msg)}</li>`).join('')}${p.warnings.length > 6 ? `<li>… y ${p.warnings.length - 6} más</li>` : ''}</ul>` : ''}`;
}

// Cuántos briefs de mensaje se han encontrado. Si no hay ninguno, no se
// dice nada: el documento no puede generar ruido (DECISIONES.md).
function resumenEstrategia(p) {
  // Qué ha aportado este documento. Si no aporta nada no se dramatiza:
  // solo dos de cada tres documentos traen material de mensaje, y eso es
  // cuestión de formato, no de calidad.
  if (!p.briefs.length) return '<div class="drop-hint">Leído · sin material de mensaje</div>';
  const terr = p.briefs.filter(b => b.fuente === 'territorio').length;
  return `<div class="drop-hint">${p.briefs.length} ${terr ? 'territorios' : 'briefs'} de mensaje</div>`;
}

function viewEntrada() {
  const f = S.files;

  // Una sola caja para los dos Excel del mes. Antes había una para cada
  // uno y era pedir un error: nadie tiene por qué saber cuál va dónde, y
  // el que se equivoque de caja recibe cien avisos que no significan
  // nada. Se sueltan los dos juntos y la herramienta mira por dentro
  // cuál es cuál.
  const fichaExcel = (clave, d) => `
    <li>
      <span class="doc-nombre">${esc(d.name)}</span>
      <span class="doc-que">${clave === 'banners' ? 'banners' : 'campañas'}</span>
      <button class="btn-del" data-clear="${clave}" title="Quitar">${ICONS.trash}</button>
    </li>
    ${d.parsed ? `<li class="doc-detalle">${clave === 'banners' ? resumenBanners(d.parsed) : resumenExcel(d.parsed)}</li>` : ''}`;

  const cajaExcel = () => {
    const puestos = [['excel', f.excel], ['banners', f.banners]].filter(([, d]) => d);
    return `
    <div class="drop-cell">
      <div class="drop ${puestos.length ? 'loaded' : ''}" data-drop="excel">
        ${puestos.length ? `
          <ul class="doclist">${puestos.map(([k, d]) => fichaExcel(k, d)).join('')}</ul>
          ${puestos.length < 2 ? `
            <button class="btn-anadir" data-drop="excel">Añadir</button>` : ''}
        ` : `
          <div class="drop-icon">${ICONS.fileBig}</div>
          <div class="drop-title">Excel del mes</div>
          <div class="drop-hint">Campañas y banners · puedes soltar los dos a la vez</div>
          <button class="btn-anadir" data-drop="excel">Añadir</button>
        `}
      </div>
    </div>`;
  };

  // La estrategia puede venir repartida en varios documentos: uno por
  // equipo (Comercialización, Dispositivos…). Se leen todos y los briefs
  // se juntan. Ninguno es obligatorio.
  const cajaEstrategia = () => {
    const docs = f.strategy;
    return `
    <div class="drop-cell">
      <div class="drop ${docs.length ? 'loaded' : ''}" data-drop="strategy">
        ${docs.length ? `
          <ul class="doclist">
            ${docs.map((d, i) => `
              <li>
                <span class="doc-nombre">${esc(d.name)}</span>
                <button class="btn-del" data-quitar-doc="${i}" title="Quitar">${ICONS.trash}</button>
              </li>`).join('')}
          </ul>
          <button class="btn-anadir" data-drop="strategy">Añadir</button>
        ` : `
          <div class="drop-icon">${ICONS.fileBig}</div>
          <div class="drop-title">Documentos de estrategia</div>
          <div class="drop-hint">.pdf o .html · puedes subir varios</div>
          <button class="btn-anadir" data-drop="strategy">Añadir</button>
        `}
      </div>
    </div>`;
  };

  // Las campañas necesitan documentos para tener contexto; los banners
  // no necesitan nada más. Con cualquiera de las dos cosas se puede
  // procesar.
  const listo = (f.excel && f.strategy.length) || !!f.banners;

  return `
  <main class="main-narrow">
    <h1 class="page">Cargar planificación del mes</h1>
    ${S.tasks.length ? `
      <p class="volver-revision">
        Hay ${S.tasks.length} tareas ya procesadas.
        <button class="btn-link-section" data-paso="revision">Volver a la revisión</button>
      </p>` : ''}
    <p style="font-size:14px;color:#605E5C;margin-top:8px;line-height:1.55">
      Suelta los Excel del mes y los documentos de estrategia. No hace falta
      acertar con la caja: la herramienta mira dentro y sabe cuál es cuál.
    </p>

    <div class="drop-grid">
      ${cajaExcel()}
      ${cajaEstrategia()}
    </div>

    ${S.avisoExcel ? `<div class="warn" style="margin-top:16px">${ICONS.warn}
      <span>${esc(S.avisoExcel)}</span></div>` : ''}

    ${f.excel && !f.strategy.length ? `<div class="warn" style="margin-top:16px">${ICONS.warn}
      <span><strong>Sin documentos de estrategia, las campañas saldrán sin contexto.</strong>
      Las tareas se crean igual, con sus fechas y sus productos, pero nadie
      sabrá qué contar en ellas. Los banners no lo necesitan.</span></div>` : ''}

    ${S.catalogos && !S.catalogos.ok ? `
      <p class="aviso-catalogos">
        Sin conexión con Asana: se usan los catálogos guardados.
        Se puede revisar la propuesta, pero no cargarla.
      </p>` : ''}

    <div style="margin-top:26px;display:flex;align-items:center;gap:14px">
      <button class="btn-primary" id="btn-procesar" ${listo ? '' : 'disabled'}>
        Procesar ${ICONS.arrow}
      </button>
      ${!listo ? `<span style="font-size:12.5px;color:#9F9C99">Sube el Excel de campañas con sus documentos, o el de banners</span>` : ''}
    </div>
  </main>`;
}

/* ---------------- 2 · PROCESANDO ---------------- */
const PASOS_PROC = [
  { titulo: 'Leyendo el Excel',
    sub: 'Campañas, fechas, productos y objetivos. Esto es mecánico y va rápido.' },
  { titulo: 'Leyendo los documentos de estrategia',
    sub: 'Buscando qué se quiere contar en cada campaña. Es la parte lenta: se leen enteros.' },
  { titulo: 'Ordenando lo que dicen los documentos',
    sub: 'Qué oferta va a qué colectivo, y en qué línea lo dice. Es lo que evita cambiar un mensaje por otro.' },
  { titulo: 'Emparejando cada campaña con su contexto',
    sub: 'Decidiendo qué le toca a cada una, o si no le toca nada.' },
  { titulo: 'Comprobando qué hay ya en Asana',
    sub: 'Buscando por PAC para no crear nada dos veces.' }
];

function reloj(seg) {
  const m = Math.floor(seg / 60), s = seg % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function viewProcesando() {
  const P = S.proc;
  return `
  <main class="main-narrow">
    <h1 class="page">Preparando la propuesta</h1>
    <p class="proc-intro">
      Suele tardar dos o tres minutos. Puedes dejar esta pestaña abierta y volver luego.
      <span class="proc-reloj"><span class="proc-latido"></span>Trabajando · <span id="proc-seg">${reloj(P.seg)}</span></span>
    </p>

    <div class="proc-lista">
      ${PASOS_PROC.map((p, i) => {
        const hecho = i < P.paso, activo = i === P.paso;
        const barra = activo && P.total > 1
          ? `<div class="proc-barra"><span style="width:${Math.round(100 * P.hechas / P.total)}%"></span></div>` : '';
        return `
        <div class="proc-step ${hecho ? 'done' : activo ? 'active' : ''}">
          <span class="proc-dot">${hecho ? ICONS.check : ''}</span>
          <div class="proc-txt">
            <div class="proc-titulo">${esc(p.titulo)}</div>
            ${activo ? `<div class="proc-sub">${esc(P.detalle || p.sub)}</div>${barra}` : ''}
          </div>
          ${activo && P.cuenta ? `<span class="proc-cuenta">${esc(P.cuenta)}</span>` : ''}
        </div>`;
      }).join('')}
    </div>

  </main>`;
}

// Lo que se ve el segundo que tarda en llegar la propuesta compartida.
function viewCargando() {
  return `
  <main class="main-narrow">
    <h1 class="page">Abriendo la revisión</h1>
    <p class="proc-intro">
      <span class="proc-reloj"><span class="proc-latido"></span>Un momento</span>
    </p>
  </main>`;
}

/* ---------------- FALLO DURANTE EL PROCESADO ----------------
   Antes, un error aquí dejaba la barra de progreso llena y el reloj
   corriendo, sin decir nada. Quien lo usa no abre la consola: si algo
   se rompe, se cuenta y se ofrece volver a intentarlo.
------------------------------------------------------------- */
function viewError() {
  return `
  <main class="main-narrow">
    <h1 class="page">No se ha podido terminar</h1>
    <p class="proc-intro">El proceso se ha parado antes de acabar. No se ha
      creado ni modificado nada en Asana.</p>
    <div class="aviso-fallo">${esc(S.error || 'Error desconocido')}</div>
    <p class="proc-intro">Puedes volver a intentarlo. Si vuelve a fallar,
      pásale este mensaje a quien mantiene la herramienta.</p>
    <div style="display:flex;gap:10px;align-items:center;margin-top:20px">
      <button class="btn-primary" id="btn-procesar">Volver a intentarlo</button>
      <button class="btn-ghost" data-paso="entrada">Volver a los ficheros</button>
    </div>
  </main>`;
}

/* ---------------- 3 · REVISIÓN ---------------- */
function viewRevision() {
  const total = S.tasks.length;
  const okN = S.tasks.filter(t => t.linkConfidence === 'high').length;
  const revN = S.tasks.filter(t => t.linkConfidence === 'low').length;
  // Los banners no se emparejan con ningún documento: su contexto lo
  // trae la propia parrilla. Contarlos como "sin vincular" haría que un
  // mes de solo banners se leyera como un fallo de principio a fin.
  const banN = S.tasks.filter(t => t.banner).length;
  const appN = S.tasks.filter(t => t.approved).length;
  const pend = total - appN;

  const pasaFiltro = t => {
    if (S.filtro === 'revisar') return t.linkConfidence === 'low';
    if (S.filtro === 'sin') return !t.description && !t.banner;
    if (S.filtro === 'pendientes') return !t.approved;
    if (S.filtro === 'cambios') return t.cambio && t.cambio !== 'igual';
    if (S.filtro === 'fallo') return !!t.sinRespuesta;
    return true;
  };
  const cambios = resumenCambios(S.tasks);
  const cambiosN = cambios.nuevas + cambios.cambiadas + cambios.idas;
  // Cuántas se quedaron sin que el modelo llegara a mirarlas. Solo se
  // dice en voz alta cuando fallaron TODAS, que es cuando significa algo
  // —no hubo modelo en esta pasada— y hay que explicarlo. Si falla una
  // suelta después de tres intentos, se marca en su fila y ya: un cartel
  // arriba por una de setenta era complicarle la vida a quien revisa
  // para contarle un caso que no entiende ni le toca arreglar.
  const fallosN = S.tasks.filter(t => t.sinRespuesta).length;
  const revisarN = S.tasks.filter(t => t.linkConfidence === 'low').length;
  // "Sin contexto" sirve para encontrar lo que se ha quedado a medias.
  // Los banners no se quedan a medias: su contexto es la parrilla. Si
  // se contasen aquí, el filtro de los agujeros estaría lleno de cosas
  // que están bien y dejaría de servir para lo que sirve.
  const sinN = S.tasks.filter(t => !t.description && !t.banner).length;

  const secciones = D.seccionesOrdenadas.map(sec => {
    const ts = S.tasks.filter(t => t.sectionId === sec.id && pasaFiltro(t));
    if (!ts.length) return '';
    const aprob = ts.filter(t => t.approved).length;
    const hayPend = aprob < ts.length;

    // Agrupar por tipología dentro de la sección
    const grupos = D.typologyOptions.map(tp => ({
      label: tp,
      tasks: ts.filter(t => (t.typology || 'Growth') === tp)
    })).filter(g => g.tasks.length);

    return `
    <section class="section ${S.dragOverSection === sec.id ? 'dragover' : ''}" data-sec="${sec.id}">
      <div class="section-head">
        <h2 class="section-title">${esc(sec.name)}</h2>
        <span class="badge count">${ts.length}</span>
        <span class="section-approved">${aprob} de ${ts.length} aprobadas</span>
        <button class="btn-link-section" data-approve-sec="${sec.id}">
          ${hayPend ? 'Aprobar sección ✓' : 'Desaprobar sección'}
        </button>
      </div>
      ${grupos.map(g => `
        <div class="group-head">
          <h3 class="group-label">${esc(g.label)}</h3>
          <span class="group-count">${g.tasks.length}</span>
        </div>
        <div class="tasks">${g.tasks.map(t => t.editing ? cardHTML(t) : rowHTML(t)).join('')}</div>
      `).join('')}
      <button class="btn-add" data-add="${sec.id}">＋ Añadir tarea</button>
    </section>`;
  }).join('');

  return `
  <main class="main">
    <div class="statsbar">
      <div class="stats-pill">
        <div class="stats-cell"><span class="stats-n">${total}</span><span class="stats-lbl">tareas</span></div>

      <h1 class="page">Propuesta de tareas</h1>

        <em>Cargar en Asana</em>.${banN === total ? `
        Los banners salen de la parrilla, tal cual: aquí no ha decidido nada un

        Cuando se resuelva, vuelve a procesar el mismo Excel: solo se buscará

      ${S.propuestaId ? `

        </div>
        <span id="estado-guardado" class="sincro ${S.sincro}">${TEXTO_SINCRO[S.sincro] || ''}</span>
      </div>

      ${cambiosN ? `
      <p class="nota-cambios">
        Excel actualizado:
        ${[cambios.nuevas ? `${cambios.nuevas} nueva${cambios.nuevas > 1 ? 's' : ''}` : '',
           cambios.cambiadas ? `${cambios.cambiadas} con datos distintos` : '',
           cambios.idas ? `${cambios.idas} ya no está${cambios.idas > 1 ? 'n' : ''} en el Excel` : '']
          .filter(Boolean).join(' · ')}.
        Cada una lleva su etiqueta. Lo demás conserva su revisión.
      </p>` : ''}

      <div class="legend">
        <span class="legend-item"><span class="bola ok"></span> Vinculación clara</span>
        <span class="legend-item"><span class="bola review"></span> Vinculación probable — revisar</span>
        <span class="legend-item"><span class="bola"></span> Sin vinculación</span>

    ${secciones.trim() ? secciones : `
      <p class="vacio">No hay tareas con este filtro.

}

// Modo lectura: una fila por tarea, valores como texto. Es la vista por
// defecto porque la mayoría de tareas se revisan, no se editan.
// Qué le ha pasado a esta tarea en la última actualización del Excel.
// Cuántas campañas llevan este mismo contexto. Seis tarjetas seguidas
// con el mismo texto parecen un fallo, y no lo son: un brief de
// territorio da para varios envíos del mes. Basta con decir cuántas son;
// explicar POR QUÉ sobra, porque quien lo lee es quien escribió el brief.
// Va DESPUÉS del texto: manda el contexto.
function compartenContexto(t) {
  const clave = (t.description || '').trim();
  if (!clave) return 0;
  return S.tasks.filter(x => (x.description || '').trim() === clave).length;
}

// Los avisos van juntos y primero: son lo único que pide algo de quien
// mira. Después el contenido, en dos bloques que se leen en el orden en
// que se piensa: qué pide esta campaña, y qué mensaje le toca.
function avisosDe(t) {
  const av = [];
  if (t.cambio === 'cambiada' && t.cambios?.length) av.push(`<strong>Ha cambiado</strong> · ${esc(t.cambios.join(', '))}. Vuelve a aprobarla si te cuadra.`);
  if (t.linkConfidence === 'low' && t.linkNote) av.push(`<strong>Revisar el mensaje</strong> · ${esc(t.linkNote)}`);
  const asana = t.asanaUrl
    ? `<p class="nota-asana">Ya está en Asana. Si el Excel dice ahora otra cosa, corrígelo allí: esta herramienta no reescribe lo cargado. <a href="${esc(t.asanaUrl)}" target="_blank" rel="noopener">Abrir la tarea</a></p>` : '';
  return av.map(x => `<p class="nota-revisar">${x}</p>`).join('') + asana;
}

// Un banner no se explica como una campaña. No tiene objetivo escrito
// por nadie: tiene una posición del menú, una semana y una creatividad.
// Y tiene una fecha que no está en el fichero —la de entrega al Plus—
// así que hay que decir de dónde sale, o parece inventada.
function bloqueBanner(t) {
  const b = t.banner;
  if (!b) return '';
  const pie = [
    b.posicion,
    `${b.semana} · ${b.vigencia}`,
    b.franjaTexto,
    b.origen ? `Origen: ${b.origen}` : '',
    b.publica ? `Publica el ${fechaCorta(b.publica)} · se entrega al Plus 3 laborables antes` : ''
  ].filter(Boolean);
  return `
    <div class="bloque">
      <span class="bloque-lbl">Creatividad del banner</span>
      <p class="bloque-txt">${esc(b.creatividad)}</p>
      <span class="bloque-pie">
        <span class="pie-fuente">Parrilla de banners · celda ${esc(b.celda)}</span>
        ${pie.map(x => `<span class="pie-linea">${esc(x)}</span>`).join('')}
      </span>
    </div>`;
}

function marcaCambio(t) {
  if (t.cambio === 'nueva') return '<span class="marca nueva">Nueva</span>';
  if (t.cambio === 'cambiada') return `<span class="marca cambiada" title="${esc((t.cambios || []).join(', '))}">Ha cambiado</span>`;
  if (t.cambio === 'desaparecida') return '<span class="marca ida" title="Esta campaña no viene en el Excel nuevo. No se carga en Asana; se enseña para que alguien decida.">Ya no está</span>';
  return '';
}

function rowHTML(t) {
  const badge = badgeHTML(t);
  return `
  <article class="row ${t.approved ? 'approved' : ''} ${t.flash ? 'flash' : ''}" data-card="${t.id}"
           draggable="true" data-drag="${t.id}">
    <button class="row-body" data-toggle="${t.id}" title="Abrir">
      <span class="chev">${ICONS.chev}</span>
      <span class="row-name">${bolaHTML(t)}<span class="row-nombre">${esc(t.name) || '<em>Sin nombre</em>'}</span>${marcaCambio(t)}${t.sinRespuesta ? '<span class="marca fallo" title="Falló la llamada al buscar su contexto. Vuelve a procesar el Excel y se mira otra vez.">Sin mirar</span>' : ''}${t.asanaUrl ? '<span class="marca asana">En Asana</span>' : ''}</span>
      <span class="row-val">${esc(t.product)}</span>
      <span class="row-val">${esc(t.format)}</span>
      <span class="row-val">${fechaCorta(t.dueDate)}</span>
      <span class="row-val muted">${esc(t.typology)}${t.palanca ? ' · ' + esc(t.palanca) : ''}</span>
    </button>
    <button class="btn-approve ${t.approved ? 'on' : ''}" data-approve="${t.id}">
      ${t.approved ? '✓ Aprobada' : 'Aprobar'}
    </button>
    <button class="btn-del" data-del="${t.id}" title="Eliminar tarea">${ICONS.trash}</button>
    ${t.description ? `<div class="row-desc" title="${esc(t.description)}">${esc(t.description.replace(/\n/g, ' · '))}</div>` : ''}
  </article>`;
}

function fechaCorta(iso) {
  if (!iso) return '<span class="muted">—</span>';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// En la fila, el semáforo es una bola — así se llama en DECISIONES.md.
// El texto completo va en la tarjeta abierta y en la leyenda.
function bolaHTML(t) {
  if (t.manual) return `<span class="bola manual" title="Creada a mano"></span>`;
  if (t.linkConfidence === 'high')
    return `<span class="bola ok" title="Vinculación clara${t.contextSource ? ' · ' + esc(t.contextSource) : ''}"></span>`;
  if (t.linkConfidence === 'low')
    return `<span class="bola review" title="Vinculación probable${t.linkNote ? ' · ' + esc(t.linkNote) : ''}"></span>`;
  return `<span class="bola"></span>`;
}

function badgeHTML(t) {
  // El badge mide la VINCULACIÓN con el PDF, no la fiabilidad del dato
  // (el Excel es fiable por definición). Sin badge = estado normal.
  return t.manual
    ? `<span class="badge manual" title="Tarea creada manualmente">Manual</span>`
    : t.linkConfidence === 'high'
      ? `<span class="badge ok" title="${esc(t.contextSource ? 'Vinculado con: ' + t.contextSource : '')}">Vinculación clara</span>`
      : t.linkConfidence === 'low'
        ? `<span class="badge review" title="${esc(t.linkNote || '')}">Vinculación probable</span>`
        : '';
}

// El brief viene con las etiquetas de la plantilla de Comercialización
// ("Idea fuerza:", "Reason why:"…). Se resaltan para que se lea como el
// brief que es y no como un párrafo corrido. El texto no se toca: la
// etiqueta sale del propio contenido.
// Las etiquetas ya no se adivinan: las escribimos nosotros al componer
// el texto desde los campos del brief (CAMPOS_BRIEF, en data.js). Antes
// esto era una lista de sinónimos escrita a mano que había que ampliar
// cada vez que Comercialización cambiaba una palabra.
const ETIQUETAS = new RegExp('^(' + CAMPOS_BRIEF.map(([, e]) => e).join('|') + ')\\s*:\\s*', 'i');

function briefHTML(texto) {
  if (!texto) return '<p class="brief-vacio">Sin contexto de estrategia vinculado</p>';
  const bloques = texto.split('\n').map(l => l.trim()).filter(Boolean).map(linea => {
    const m = linea.match(ETIQUETAS);
    if (!m) return `<p class="brief-l">${esc(linea)}</p>`;
    const resto = linea.slice(m[0].length).trim();
    return `<p class="brief-l"><b>${esc(m[1])}</b>${resto ? ' · ' + esc(resto) : ''}</p>`;
  });
  return `<div class="brief">${bloques.join('')}</div>`;
}

function cardHTML(t) {
  const badge = badgeHTML(t);

  const sel = (campo, opts, val) => `
    <select data-set="${campo}" data-id="${t.id}" class="${val && !opts.includes(val) ? 'sin-catalogo' : ''}">
      ${opts.includes(val) ? '' : `<option value="" selected>${val ? esc(val) + ' — no existe en Asana, elige otro' : 'Sin asignar'}</option>`}
      ${opts.map(o => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    </select>`;

  // Cerrada, la tarjeta tiene que decir de qué va sin abrirla. En un
  // banner eso no es la descripción —no la tiene— sino dónde sale y qué
  // pieza es.
  const descPrev = t.description
    ? t.description.replace(/\n/g, ' · ').slice(0, 150)
    : t.banner
      ? `${t.banner.posicion} · ${t.banner.semana} ${t.banner.franja} · ${t.banner.creatividad}`.slice(0, 150)
      : 'Añadir a mano';
  const comparten = compartenContexto(t);

  return `
  <article class="card ${t.approved ? 'approved' : ''} ${t.flash ? 'flash' : ''}" data-card="${t.id}"
           draggable="true" data-drag="${t.id}">
    <div class="card-row1" data-toggle="${t.id}" title="Cerrar">
      <span class="chev open">${ICONS.chev}</span>
      ${badge}${marcaCambio(t)}
      <input class="card-name" value="${esc(t.name)}" data-set="name" data-id="${t.id}"
             placeholder="PAC00000_Nombre_Segmento_Mes" spellcheck="false">
      <button class="btn-approve ${t.approved ? 'on' : ''}" data-approve="${t.id}">
        ${t.approved ? '✓ Aprobada' : 'Aprobar'}
      </button>
      <button class="btn-del" data-del="${t.id}" title="Eliminar tarea">${ICONS.trash}</button>
    </div>

    <div class="card-fields">
      <label class="field"><span class="field-label">Producto</span>${sel('product', D.productOptions, t.product)}</label>
      <label class="field"><span class="field-label">Formato</span>${sel('format', D.formatOptions, t.format)}</label>
      <label class="field"><span class="field-label">Fecha</span>
        <input type="date" value="${esc(t.dueDate)}" data-set="dueDate" data-id="${t.id}">
      </label>
      <label class="field"><span class="field-label">Palanca</span>${sel('palanca', D.palancaOptions, t.palanca)}</label>
      <label class="field"><span class="field-label">Tipología</span>${sel('typology', D.typologyOptions, t.typology || 'Growth')}</label>
    </div>

    <div class="card-desc field">
      ${t.descOpen ? `
        ${avisosDe(t)}

        ${t.banner ? bloqueBanner(t) : t.excel?.objetivo ? `
          <div class="bloque">
            <span class="bloque-lbl">Objetivo de la campaña</span>
            <p class="bloque-txt">${esc(t.excel.objetivo)}</p>
            <span class="bloque-pie">
              <span class="pie-fuente">Del Excel de planificación</span>
              ${t.excel.peticionario ? `
                <span class="pie-linea">Peticionario: ${esc(t.excel.peticionario)}</span>` : ''}
            </span>
          </div>` : ''}

        ${t.description || t.descEdit ? `
          <div class="bloque">
            <div class="bloque-cab">
              <span class="bloque-lbl">Estrategia del mes</span>
              <span class="bloque-acciones">
                <button class="desc-ampliar" data-descedit="${t.id}">${t.descEdit ? 'Hecho' : 'Editar'}</button>
                <button class="desc-ampliar" data-desc="${t.id}">Ocultar</button>
              </span>
            </div>
            ${t.descEdit
              ? `<textarea class="desc-ta" rows="10" data-set="description" data-id="${t.id}">${esc(t.description)}</textarea>`
              : briefHTML(t.description)}
            <span class="bloque-pie">
              <span class="pie-fuente">${t.contextSource ? esc(t.contextSource) : 'Escrito a mano'}</span>
              ${t.contextEntrada ? `<span class="pie-linea">Para: ${esc(t.contextEntrada)}</span>` : ''}
              ${comparten > 1 ? `<span class="pie-linea">Lo comparten ${comparten} campañas</span>` : ''}
            </span>
          </div>` : `
          <div class="bloque vacio">
            <span class="bloque-lbl">Estrategia del mes</span>
            <p class="bloque-txt">${t.banner
              ? 'Los banners no se cruzan con los documentos del mes: la parrilla ya dice de qué es cada pieza.'
              : `${t.sinContextoNota
                  ? esc(t.sinContextoNota)
                  : 'Ningún documento del mes habla de esta campaña.'} La tarea se crea igual.`}</p>
            <span class="bloque-acciones"><button class="desc-ampliar" data-descedit="${t.id}">Escribirlo a mano</button></span>
          </div>`}
      ` : `
        <div class="field desc-cerrado" data-desc="${t.id}">
          <span class="field-label">${t.description ? 'Contexto' : t.banner ? 'Banner' : 'Sin contexto'}</span>
          <p class="desc-preview">
            <span class="desc-txt">${esc(descPrev)}</span>
            <button class="desc-ampliar" data-desc="${t.id}">${t.description || t.banner ? 'Ampliar' : 'Añadir'}</button>
          </p>
        </div>
      `}
    </div>
  </article>`;
}

/* ---------------- 4 · CONFIRMAR ---------------- */
function viewConfirmar() {
  const app = S.tasks.filter(t => t.approved);
  const pend = S.tasks.length - app.length;
  // Lo que ya está en Asana no se vuelve a crear. Antes se mandaba todo
  // lo aprobado, mirase o no si existía: abrir el enlace después de una
  // carga y volver a pulsar duplicaba el mes entero.
  // Tres grupos: las que ya están y no se tocan, las que ya están pero
  // el Excel les ha cambiado el nombre, y las que no están.
  const renombran = app.filter(t => t.asanaGid && t.asanaName && t.asanaName !== t.name);
  const yaEstan   = app.filter(t => t.asanaUrl && !renombran.includes(t));
  const faltan    = app.filter(t => !t.asanaUrl);

  const porSec = D.seccionesOrdenadas.map(s => ({
    name: s.name,
    n: faltan.filter(t => t.sectionId === s.id).length
  })).filter(x => x.n);

  if (S.comprobando) {
    return `
    <main class="main-narrow">
      <h1 class="page">Mirando qué hay ya en Asana…</h1>
      <p style="font-size:14px;color:#605E5C;margin-top:8px">
        Para no crear dos veces lo que ya se creó.
      </p>
    </main>`;
  }

  if (S.loading) {
    const [i, tot] = S.loadProgress;
    return `
    <main class="main-narrow">
      <h1 class="page">Creando tareas en Asana…</h1>
      <p style="font-size:14px;color:#605E5C;margin:8px 0 26px">${i} de ${tot} creadas</p>
      <div style="height:8px;background:#F3EEEA;border-radius:9999px;overflow:hidden">
        <div style="height:100%;background:#0066FF;border-radius:9999px;width:${tot ? (i/tot*100) : 0}%;transition:.15s"></div>
      </div>
    </main>`;
  }

  return `
  <main class="main-narrow">
    <button class="btn-ghost" id="btn-back" style="margin:0 0 18px -12px">← Volver a la revisión</button>
    <h1 class="page">${faltan.length
      ? `Vas a crear ${faltan.length} tarea${faltan.length > 1 ? 's' : ''} en Asana`
      : renombran.length
        ? `Vas a renombrar ${renombran.length} tarea${renombran.length > 1 ? 's' : ''} en Asana`
        : 'No hay nada que crear'}</h1>
    <p style="font-size:14px;color:#605E5C;margin:8px 0 24px">
      Proyecto de destino: <strong style="color:#262423">${esc(D.asanaProject?.name || '')}</strong>
    </p>

    ${yaEstan.length || renombran.length ? `
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-row">
          <span><strong>${yaEstan.length}</strong> ya están en Asana</span>
          <span style="color:#605E5C">no se tocan</span>
        </div>
        ${renombran.length ? `
        <div class="panel-row">
          <span><strong>${renombran.length}</strong> cambiaron de nombre</span>
          <span style="color:#605E5C">se renombran</span>
        </div>` : ''}
        <div class="panel-row">
          <span><strong>${faltan.length}</strong> falta${faltan.length === 1 ? '' : 'n'}</span>
          <span style="color:#605E5C">${faltan.length ? 'se crean ahora' : '—'}</span>
        </div>
      </div>` : ''}

    ${faltan.length ? `<div class="panel" style="margin-bottom:16px">` : '<div style="display:none">'}
      ${porSec.map(x => `
        <div class="panel-row"><span>${esc(x.name)}</span><strong>${x.n} tarea${x.n > 1 ? 's' : ''}</strong></div>
      `).join('')}
      <div class="panel-row" style="border-top:1px solid #DFDBD6">
        <span style="font-weight:700">Estado inicial</span>
        <span style="color:#605E5C">${esc(D.estadoInicial)}</span>
      </div>
    </div>

    ${pend ? `<div class="warn" style="margin-bottom:16px">${ICONS.warn}
      <span><strong>${pend} tarea${pend > 1 ? 's' : ''} sin aprobar</strong> no se cargará${pend > 1 ? 'n' : ''}.
      Puedes volver atrás para aprobarlas o cargarlas en otro momento.</span></div>` : ''}

    <button class="btn-primary" id="btn-cargar" ${faltan.length || renombran.length ? '' : 'disabled'}>
      ${faltan.length && renombran.length
        ? `Crear ${faltan.length} y renombrar ${renombran.length} ${ICONS.arrow}`
        : faltan.length
          ? `Crear ${faltan.length} tarea${faltan.length > 1 ? 's' : ''} en Asana ${ICONS.arrow}`
          : renombran.length
            ? `Renombrar ${renombran.length} tarea${renombran.length > 1 ? 's' : ''} ${ICONS.arrow}`
            : 'Todo lo aprobado ya está en Asana'}
    </button>
  </main>`;
}

/* ---------------- 5 · RESULTADO ---------------- */
// Asana contesta en inglés y con un enlace a su documentación. Quien
// usa esto no necesita leer la documentación de Asana: necesita saber si
// tiene que hacer algo o solo volver a darle al botón.
function motivoClaro(txt) {
  const t = txt || '';
  if (/usage limits?/i.test(t)) {
    const cuando = (t.match(/regain access on ([0-9-]+)/i) || [])[1];
    return 'La cuenta de Anthropic ha llegado a su límite de gasto'
      + (cuando ? `, y no vuelve hasta el ${cuando}` : '')
      + '. Hay que subir el límite en la consola de Anthropic; no es un fallo de los ficheros.';
  }
  // Un 503 de Anthropic dice "credential validation failed", que suena a
  // clave mala y no lo es: pasó el 29-sep-2026 y lo primero que se hizo
  // fue sospechar de la clave. Rotarla habría empeorado las cosas.
  if (/ANTHROPIC_API_KEY|clave del modelo/i.test(t)) {
    return 'A este Worker le falta la clave del modelo. Sin ella no se pueden '
      + 'leer los documentos: se pone con «npx wrangler secret put ANTHROPIC_API_KEY».';
  }
  if (/\b503\b|overloaded|service unavailable/i.test(t)) {
    return 'Anthropic está teniendo problemas en este momento. No es tu fichero '
      + 'ni tu clave: se puede comprobar en status.claude.com. Reintenta en unos minutos.';
  }
  if (/credit balance|insufficient/i.test(t)) {
    return 'La cuenta de Anthropic se ha quedado sin saldo. Hay que recargarla; no es un fallo de los ficheros.';
  }
  if (/too many requests|rate limit/i.test(t)) {
    return 'Asana estaba saturado en ese momento. Reintenta: no hay nada que corregir.';
  }
  if (/not a valid value|enum/i.test(t)) {
    return 'Asana no acepta alguno de los valores. Revisa producto, formato o estado.';
  }
  return t;
}

    ${S.renombradas?.failed?.length ? `

/* ---------------- RENDER ---------------- */
function render() {
  renderStepper();
  const v = { entrada: viewEntrada, cargando: viewCargando, procesando: viewProcesando, revision: viewRevision,
              confirmar: viewConfirmar, resultado: viewResultado, error: viewError }[S.screen];
  document.getElementById('app').innerHTML = v();
  S.tasks.forEach(t => t.flash = false);
}

/* ---------------- ACCIONES ---------------- */
function patch(id, campos) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  Object.assign(t, campos);
  // Abrir o cerrar una tarjeta es cosa de quien mira, no del equipo.
  const reales = Object.fromEntries(Object.entries(campos)
    .filter(([k]) => !['editing', 'descOpen', 'descEdit', 'flash'].includes(k)));
  if (Object.keys(reales).length) guardar(id, reales);
  // Cambiar producto recoloca la tarjeta en su sección
  if (campos.product) {
    const dest = D.productSectionMap[campos.product];
    if (dest && dest !== t.sectionId) { t.sectionId = dest; t.flash = true; }
  }
  render();
}

/* ---------------- REPRODUCIR UNA PASADA GRABADA ----------------
   Solo con ?demo=<propuesta> en la dirección. Sin eso, este camino
   no existe: el fichero ni siquiera se descarga.

   Es para enseñar la herramienta a una sala. La pasada de verdad
   tarda nueve minutos porque se lee 350 páginas, y nadie mira una
   barra nueve minutos —en la vida real tampoco: se procesa un día
   y se revisa otro—. Lo que se reproduce son los pasos reales de
   una pasada concreta, acelerados, y al terminar se abre la
   propuesta de verdad: lo que se revisa y lo que se carga en Asana
   no tiene nada de grabado.
---------------------------------------------------------------- */
async function reproducirGrabacion(id) {
  if (!window.DEMO) {
    await new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = 'demo.js'; s.onload = ok; s.onerror = mal;
      document.head.appendChild(s);
    });
  }
  S.screen = 'procesando';
  S.proc = { paso: 0, detalle: '', cuenta: '', hechas: 0, total: 0, inicio: Date.now(), seg: 0 };
  S.reproduciendo = true;
  render();

  await DEMO.reproducir(p => {
    Object.assign(S.proc, p);
    // El reloj que se ve es el de la pasada real. Enseñar siete
    // segundos mientras dice "documento 3 de 3" cantaría solo.
    S.proc.seg = p.segGrabados;
    render();
    const el = document.getElementById('proc-seg');
    if (el) el.textContent = reloj(p.segGrabados);
  });

  S.reproduciendo = false;
  // Y a partir de aquí, la propuesta de verdad: el mismo camino que
  // sigue cualquiera que abra el enlace compartido.
  location.hash = id;
  if (!await abrirDesdeEnlace()) { S.screen = 'entrada'; render(); }
}

async function procesar() {
  // Con ?demo= no se llama al modelo: se reproduce lo grabado.
  const demo = new URLSearchParams(location.search).get('demo');
  if (demo) return reproducirGrabacion(demo);

  S.screen = 'procesando';
  S.proc = { paso: 0, detalle: '', cuenta: '', hechas: 0, total: 0, inicio: Date.now(), seg: 0 };
  render();

  // El reloj corre solo: es la señal de que sigue vivo aunque el paso
  // tarde un minuto en cambiar.
  //
  // Se escribe directamente en su elemento, sin repintar la pantalla:
  // repintar cada segundo recreaba el spinner y reiniciaba su giro, así
  // que parecía parado justo cuando más importa que se mueva.
  const tic = setInterval(() => {
    if (S.screen !== 'procesando') return clearInterval(tic);
    S.proc.seg = Math.floor((Date.now() - S.proc.inicio) / 1000);
    const el = document.getElementById('proc-seg');
    if (el) el.textContent = reloj(S.proc.seg);
  }, 1000);

  try {
    // Si ya había una propuesta abierta, esto es una actualización: hay
    // que saber qué había antes ANTES de gastar un solo minuto de
    // modelo, porque de ahí sale qué hace falta calcular y qué no.
    const guardada = S.propuestaId ? await API.abrirPropuesta(S.propuestaId) : null;
    const previas = guardada?.tareas || (S.propuestaId ? S.tasks : []);

    // Mismos documentos → el contexto ya está calculado y guardado.
    // Solo se buscará para las campañas que no estaban en la propuesta.
    const seguimos = previas.length && mismosDocumentos(guardada?.ficheros?.estrategia, S.files.strategy);
    const briefs = seguimos ? (guardada?.briefs || []) : [];
    const entradas = seguimos ? (guardada?.entradas || []) : [];
    // "Ya la conocemos" solo vale si el modelo llegó a contestar sobre
    // ella. Si se quedó sin respuesta —se cayó el modelo, se agotó la
    // cuenta— no es una decisión, es una pregunta sin hacer: se vuelve a
    // preguntar. Si no, esas campañas se quedarían sin contexto para
    // siempre, porque las pasadas siguientes las darían por resueltas.
    const conocidos = new Set(previas.filter(t => !t.sinRespuesta)
      .map(t => t.pac).filter(Boolean));
    const soloPacs = briefs.length
      ? new Set((S.files.excel?.parsed?.tasks || [])
          .map(t => t.pac).filter(p => p && !conocidos.has(p)))
      : null;

    // Repintar solo cuando cambia algo visible: cada repintado corta el
    // giro del spinner.
    let firma = '';
    const leido = S.files.excel
      ? await API.interpretarDocumentos(S.files.excel, S.files.strategy, info => {
          Object.assign(S.proc, info);
          const nueva = `${info.paso}|${info.cuenta || ''}|${info.detalle || ''}`;
          if (nueva === firma) return;
          firma = nueva;
          render();
        }, { briefs, entradas, soloPacs })
      : { tareas: [], briefs: [], entradas: [], fallo: '' };

    // Los banners ya están leídos: se leyeron al soltar el fichero y son
    // deterministas de principio a fin. No pasan por el modelo porque no
    // hay nada que deducir —la celda dice de qué va la pieza— así que no
    // cuestan ni una llamada ni un minuto de espera.
    const deBanners = S.files.banners?.parsed?.tasks || [];
    const tasks = [...leido.tareas, ...deBanners];
    S.falloModelo = leido.fallo || '';
    if (!tasks.length) { S.screen = 'entrada'; return; }
    const nuevas = tasks.map(t => Object.assign(
      { approved: false, descOpen: false, flash: false, editing: false, typology: 'Growth' }, t));

    S.tasks = previas.length ? fusionarConPropuesta(previas, nuevas) : nuevas;
    Object.assign(S.proc, { paso: 4, detalle: '', cuenta: '', hechas: 0, total: 0 });
    render();
    S.dupes = await API.comprobarDuplicados(S.tasks, info => {
      Object.assign(S.proc, info, { paso: 4 });
      render();
    });
    anotarLoQueYaEsta(S.dupes);
    S.dupesCuando = Date.now();
    // El enlace se conserva si ya existía: es el que ha circulado.
    const doc = S.propuestaId
      ? await API.guardarPropuesta(S.propuestaId, ficherosDeLaPropuesta(), S.tasks, leido.briefs, leido.entradas)
      : await API.crearPropuesta(ficherosDeLaPropuesta(), S.tasks, leido.briefs, leido.entradas);
    if (doc) {
      S.propuestaId = doc.id;
      S.propuestaVer = doc.version || 1;
      history.replaceState(null, '', '#' + doc.id);
      escucharCambios();
    }
    S.screen = 'revision';
  } catch (e) {
    // Un fallo aquí dejaba la pantalla de progreso girando para siempre.
    // Quien lo usa no tiene consola: si algo se rompe, se dice.
    console.error(e);
    S.error = e?.message || 'Algo ha fallado durante el procesado';
    S.screen = 'error';
  } finally {
    clearInterval(tic);
    render();
  }
}

// Dos documentos son el mismo si coinciden nombre y tamaño. No hace
// falta más: nadie manda dos ficheros distintos con el mismo nombre y
// los mismos bytes.
function mismosDocumentos(antes, ahora) {
  const firma = ds => (ds || []).map(d => `${d.name}:${d.bytes || 0}`).sort().join('|');
  const a = firma(antes);
  return !!a && a === firma(ahora);
}

async function cargar() {
  S.loading = true; render();
  // Solo lo aprobado que NO esté ya en Asana. Antes iba todo lo
  // aprobado: pulsar dos veces, o abrir el enlace y pulsar, creaba otra
  // vez lo que ya existía.
  // Primero los renombrados: son tareas que ya existen y solo hay que
  // corregirles el nombre. Si se hiciera después, la pantalla de
  // resultado ya estaría pintada y no se vería.
  const renombrar = S.tasks.filter(t => t.approved && t.asanaGid && t.asanaName && t.asanaName !== t.name);
  if (renombrar.length) {
    const r = await API.renombrarEnAsana(renombrar);
    for (const hecha of r.renamed || []) {
      const t = S.tasks.find(x => x.id === hecha.id);
      if (t) { t.asanaName = hecha.name; guardar(t.id, { asanaName: hecha.name }); }
    }
    S.renombradas = r;
  }

  const app = S.tasks.filter(t => t.approved && !t.asanaUrl);
  if (!app.length && !renombrar.length) { S.loading = false; render(); return; }
  if (!app.length) { S.loading = false; S.screen = 'resultado'; S.result = { created: [], failed: [] }; render(); return; }
  S.result = await API.cargarEnAsana(app, {
    onCreada: creadas => creadas.forEach(c => {
      const t = S.tasks.find(x => x.id === c.id);
      if (!t) return;
      Object.assign(t, { asanaUrl: c.url, asanaGid: c.gid, asanaName: c.name });
      guardar(t.id, { asanaUrl: c.url, asanaGid: c.gid, asanaName: c.name });
    }),
    onProgress: (i, tot) => { S.loadProgress = [i, tot]; render(); }
  });
  S.loading = false;
  S.screen = 'resultado';
  render();
}

/* ---------------- ACTUALIZAR UNA PROPUESTA ----------------
   En esta compañía el Excel se vuelve a mandar: cambia una fecha, entra
   una campaña nueva, se cae otra. Volver a empezar de cero perdería el
   trabajo de revisión de todo el mundo.

   Así que cuando ya hay una propuesta abierta, la nueva pasada se
   compara con ella:

   · igual         → se conserva, incluida su aprobación
   · cambiada      → se marca qué cambió y pierde la aprobación, porque
                     quien dijo que sí dijo que sí a otra cosa
   · nueva         → entra sin aprobar
   · desaparecida  → se avisa y no se carga. Nunca se borra nada.

   Lo ya cargado en Asana no se toca: si cambia, se avisa y lo corrige
   una persona. Esto es una carretilla de volcado, no reescribe.
---------------------------------------------------------- */
const CAMPOS_COMPARADOS = [
  ['name', 'Nombre'],
  ['product', 'Producto'],
  ['format', 'Formato'],
  ['dueDate', 'Fecha de entrega'],
  ['palanca', 'Palanca'],
  ['sectionId', 'Sección'],
  ['description', 'Contexto']
];

function compararTarea(previa, nueva) {
  return CAMPOS_COMPARADOS
    .filter(([campo]) => (previa[campo] || '') !== (nueva[campo] || ''))
    .map(([, etiqueta]) => etiqueta);
}

function fusionarConPropuesta(previas, nuevas) {
  const antes = new Map(previas.map(t => [t.pac || t.id, t]));
  const vistas = new Set();

  const tareas = nuevas.map(n => {
    const clave = n.pac || n.id;
    const p = antes.get(clave);
    vistas.add(clave);
    if (!p) return { ...n, cambio: 'nueva' };

    // El contexto no es un dato del Excel: lo deduce el modelo de unos
    // documentos que normalmente no han cambiado. Así que se conserva,
    // y con él la aprobación. Y lo que alguien escribió a mano no lo
    // pisa nadie, ni una pasada nueva.
    const contexto = (p.editada || !n.description) ? {
      description:    p.description,
      editada:        p.editada,
      contextSource:  p.contextSource,
      linkConfidence: p.linkConfidence,
      linkNote:       p.linkNote
    } : {};
    const fusion = { ...n, ...contexto };

    const cambios = compararTarea(p, fusion);
    // Lo que ya está en Asana se arrastra entero: el enlace, el
    // identificador y el nombre con el que quedó. Arrastrar solo el
    // enlace dejaba la tarea reconocida pero intocable: sin el
    // identificador no se puede renombrar, y sin el nombre no se sabe
    // siquiera que el Excel lo ha cambiado.
    const enAsana = p.asanaUrl
      ? { asanaUrl: p.asanaUrl, asanaGid: p.asanaGid, asanaName: p.asanaName }
      : {};
    if (!cambios.length) {
      return { ...fusion, ...enAsana, approved: p.approved, cambio: 'igual' };
    }
    return { ...fusion, ...enAsana, approved: false, cambio: 'cambiada', cambios };
  });

  // Las que ya no vienen en el Excel: se avisan, no se borran.
  const idas = previas
    .filter(t => !vistas.has(t.pac || t.id))
    .map(t => ({ ...t, approved: false, cambio: 'desaparecida' }));

  return [...tareas, ...idas];
}

function resumenCambios(tareas) {
  const cuenta = t => tareas.filter(x => x.cambio === t).length;
  return { nuevas: cuenta('nueva'), cambiadas: cuenta('cambiada'), idas: cuenta('desaparecida') };
}

/* ---------------- QUÉ HAY YA EN ASANA ----------------
   Un registro de lo que pasó la vez anterior puede mentir: si Asana
   crea la tarea y se pierde la respuesta, nosotros apuntamos "falló" y
   al reintentar duplicamos. La única fuente fiable es Asana.

   La búsqueda ya se hacía —es el paso de duplicados— pero su resultado
   se tiraba. Ahora marca las tareas que ya existen, y esas no se vuelven
   a crear. Da igual si las creamos nosotros o alguien a mano: si están,
   están.
---------------------------------------------------------- */
function anotarLoQueYaEsta(encontrados) {
  for (const d of encontrados || []) {
    // Una búsqueda vale para todas las tareas que se llaman igual, y
    // Asana puede devolver varias con ese nombre. Se reparten una a una:
    // si hay dos tareas repetidas y en Asana ya existen las dos, se
    // marcan las dos. Si solo existe una, la otra sigue pendiente y se
    // creará, que es lo correcto.
    const mismas = S.tasks.filter(t => (t.pac || t.name) === d.texto && !t.asanaUrl);
    const libres = (d.encontradas || []).slice();
    for (const t of mismas) {
      const sitio = libres.shift();
      if (!sitio) break;
      // El gid permite renombrarla después; el nombre, saber si el Excel
      // lo ha cambiado desde entonces.
      Object.assign(t, { asanaUrl: sitio.url, asanaGid: sitio.gid, asanaName: sitio.name });
      guardar(t.id, { asanaUrl: sitio.url, asanaGid: sitio.gid, asanaName: sitio.name });
    }
  }
}

// Antes de escribir se vuelve a preguntar, salvo que se acabe de
// preguntar. Quien llega por el enlace compartido no ha pasado por el
// paso 2, y es justo quien más riesgo tiene de duplicar.
const FRESCURA = 5 * 60 * 1000;
async function refrescarLoQueYaEsta() {
  if (S.dupesCuando && Date.now() - S.dupesCuando < FRESCURA) return;
  const candidatas = S.tasks.filter(t => t.approved && !t.asanaUrl);
  if (!candidatas.length) { S.dupesCuando = Date.now(); return; }
  S.comprobando = true; render();
  try {
    anotarLoQueYaEsta(await API.comprobarDuplicados(candidatas));
    S.dupesCuando = Date.now();
  } catch (e) {
    // No poder comprobar no bloquea: se avisa en la propia pantalla.
    console.error(e);
    S.dupesCuando = 0;
  } finally {
    S.comprobando = false; render();
  }
}

/* ---------------- PROPUESTA COMPARTIDA ---------------- */
function ficherosDeLaPropuesta() {
  return {
    excel: S.files.excel ? { name: S.files.excel.name, ext: S.files.excel.ext } : null,
    banners: S.files.banners ? { name: S.files.banners.name, ext: S.files.banners.ext } : null,
    estrategia: (S.files.strategy || []).map(d => ({ name: d.name, ext: d.ext, bytes: d.bytes || 0 }))
  };
}

// Se guarda un poco después del último cambio: aprobar una sección son
// veinte cambios seguidos y no hace falta escribir veinte veces.
let guardadoPendiente;
function guardar(id, campos) {
  if (!S.propuestaId) return;
  S.tocadas[id] = Object.assign(S.tocadas[id] || {}, campos);
  S.sincro = 'guardando'; pintarSincro();
  clearTimeout(guardadoPendiente);
  guardadoPendiente = setTimeout(async () => {
    const cambios = Object.entries(S.tocadas).map(([id, campos]) => ({ id, campos }));
    S.tocadas = {};
    const doc = await API.guardarCambios(S.propuestaId, cambios);
    if (doc) S.propuestaVer = doc.version || S.propuestaVer;
    S.sincro = doc ? 'guardado' : 'fuera';
    pintarSincro();
  }, 700);
}

const TEXTO_SINCRO = {
  guardando: 'Guardando…',
  guardado: 'Todo guardado',
  fuera: 'Sin conexión: los cambios no se están guardando'
};
function pintarSincro() {
  const el = document.getElementById('estado-guardado');
  if (el) {
    el.textContent = TEXTO_SINCRO[S.sincro] || '';
    el.className = 'sincro ' + S.sincro;
  }
}

// Mientras la revisión está abierta se pregunta cada pocos segundos si
// alguien ha aprobado algo. Es lo que hace que sea una revisión de
// equipo y no cuatro copias que se pisan.
let sondeo;
function escucharCambios() {
  clearInterval(sondeo);
  sondeo = setInterval(async () => {
    if (S.screen !== 'revision' || !S.propuestaId) return;
    if (Object.keys(S.tocadas).length) return;   // primero lo nuestro
    const doc = await API.abrirPropuesta(S.propuestaId, S.propuestaVer);
    if (!doc || doc.sinCambios) return;
    S.propuestaVer = doc.version || 0;
    // Se respeta lo que se esté editando en esta pantalla.
    const abiertas = new Map(S.tasks.map(t => [t.id, t]));
    S.tasks = (doc.tareas || []).map(t => {
      const mia = abiertas.get(t.id);
      return mia ? { ...t, editing: mia.editing, descOpen: mia.descOpen, descEdit: mia.descEdit } : t;
    });
    render();
  }, 5000);
}

// Si la dirección trae un identificador, se abre esa propuesta en vez
// de empezar de cero.
async function abrirDesdeEnlace() {
  const id = location.hash.replace('#', '').trim();
  if (!id) return false;
  const doc = await API.abrirPropuesta(id);
  if (!doc || doc.error) {
    alert('Ese enlace ya no existe o ha caducado. Las revisiones se guardan 90 días.');
    history.replaceState(null, '', location.pathname);
    return false;
  }
  S.propuestaId = doc.id;
  S.files = {
    excel: doc.ficheros?.excel || { name: '(cargado en otro momento)', ext: '' },
    banners: doc.ficheros?.banners || null,
    strategy: doc.ficheros?.estrategia || []
  };
  S.propuestaVer = doc.version || 0;
  S.tasks = doc.tareas || [];
  S.screen = 'revision';
  render();
  escucharCambios();
  return true;
}

/* ---------------- EVENTOS ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-approve],[data-del],[data-desc],[data-add],[data-toggle],[data-quitar-doc],[data-descedit],[data-paso],[data-filtro],[data-compartir],[data-approve-sec],[data-clear],[data-drop],#btn-procesar,#btn-confirmar,#btn-back,#btn-cargar,#btn-reset,#btn-retry');
  if (!el) return;

  if (el.dataset.compartir) {
    const url = location.origin + location.pathname + '#' + S.propuestaId;
    let ok = false;
    try {
      await navigator.clipboard.writeText(url); ok = true;
    } catch {
      // Algunos navegadores no dejan copiar así. Se intenta a la antigua
      // antes de rendirse y pedírselo a la persona.
      try {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch { /* abajo */ }
    }
    if (!ok) { prompt('Copia el enlace:', url); return; }
    // El aviso se queda cinco segundos y enseña el enlace copiado: si
    // solo cambia el botón medio segundo, parece que no ha pasado nada.
    S.copiado = true; render();
    clearTimeout(window.__copiado);
    window.__copiado = setTimeout(() => { S.copiado = false; render(); }, 5000);
  }
  else if (el.dataset.filtro) {
    S.filtro = el.dataset.filtro; render(); window.scrollTo(0, 0);
  }
  else if (el.dataset.paso) {
    S.screen = el.dataset.paso; render();
    window.scrollTo(0, 0);
  }
  else if (el.dataset.approve) {
    const t = S.tasks.find(x => x.id === el.dataset.approve);
    // Aprobar da la revisión por terminada: la tarjeta se cierra.
    patch(t.id, { approved: !t.approved, editing: false });
  }
  else if (el.dataset.del) {
    S.tasks = S.tasks.filter(x => x.id !== el.dataset.del); render();
  }
  else if (el.dataset.toggle) {
    // Acordeón: la fila abre, la cabecera de la tarjeta cierra. Los
    // controles de dentro (nombre, aprobar, borrar) no cuentan como clic.
    if (e.target.closest('input,select,textarea,[data-approve],[data-del]')) return;
    const t = S.tasks.find(x => x.id === el.dataset.toggle);
    patch(t.id, { editing: !t.editing });
  }
  else if (el.dataset.descedit) {
    const t = S.tasks.find(x => x.id === el.dataset.descedit);
    patch(t.id, { descEdit: !t.descEdit });
  }
  else if (el.dataset.desc) {
    const t = S.tasks.find(x => x.id === el.dataset.desc);
    patch(t.id, { descOpen: !t.descOpen });
  }
  else if (el.dataset.add) {
    const sec = el.dataset.add;
    const prod = Object.keys(D.productSectionMap).find(p => D.productSectionMap[p] === sec) || 'Otros';
    S.tasks.push({
      id: 'm' + Date.now(), sectionId: sec, name: '', product: prod,
      format: D.formatOptions[0], dueDate: '', clientType: '', palanca: '',
      typology: 'Growth', manual: true, description: '',
      approved: false, descOpen: false, flash: true, editing: true
    });
    render();
    document.querySelector(`[data-card="m${''}"]`);
    const inp = document.querySelector('.card.flash .card-name');
    if (inp) inp.focus();
  }
  else if (el.dataset.approveSec) {
    const ts = S.tasks.filter(t => t.sectionId === el.dataset.approveSec);
    const hayPend = ts.some(t => !t.approved);
    ts.forEach(t => { t.approved = hayPend; guardar(t.id, { approved: hayPend }); });
    render();
  }
  else if (el.dataset.clear) {
    S.files[el.dataset.clear] = null; render();
  }
  else if (el.dataset.quitarDoc) {
    S.files.strategy.splice(+el.dataset.quitarDoc, 1); render();
  }
  else if (el.dataset.drop) {
    const key = el.dataset.drop;
    // La caja de Excel sigue abierta mientras falte alguno de los dos.
    if (key === 'excel' && S.files.excel && S.files.banners) return;
    abrirSelector(key);
  }
  else if (el.id === 'btn-procesar') procesar();
  else if (el.id === 'btn-confirmar') {
    S.screen = 'confirmar'; render();
    await refrescarLoQueYaEsta();
  }
  else if (el.id === 'btn-back') { S.screen = 'revision'; render(); }
  else if (el.id === 'btn-cargar') { el.disabled = true; cargar(); }
  else if (el.id === 'btn-retry') {
    const ids = S.result.failed.map(f => f.id);
    S.tasks.forEach(t => t.approved = ids.includes(t.id));
    S.screen = 'confirmar'; render();
  }
  else if (el.id === 'btn-reset') {
    Object.assign(S, {
      screen: 'entrada',
      files: { excel: null, banners: null, strategy: [] },  // lista vacía, no null: la entrada la recorre
      tasks: [], dupes: [], result: null, procStep: -1, procPasos: []
    });
    render();
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]');
  if (!el) return;
  const campos = { [el.dataset.set]: el.value };
  // Un contexto escrito a mano queda marcado para siempre: ninguna
  // pasada posterior lo sobrescribe.
  if (el.dataset.set === 'description') campos.editada = true;
  patch(el.dataset.id, campos);
});

// Drag & drop entre secciones
document.addEventListener('dragstart', e => {
  const h = e.target.closest('[data-drag]');
  if (!h) return;
  S.dragId = h.dataset.drag;
  h.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragend', () => {
  S.dragId = null; S.dragOverSection = null; render();
});
document.addEventListener('dragover', e => {
  const sec = e.target.closest('[data-sec]');
  if (!sec || !S.dragId) return;
  e.preventDefault();
  if (S.dragOverSection !== sec.dataset.sec) {
    S.dragOverSection = sec.dataset.sec;
    document.querySelectorAll('.section').forEach(s =>
      s.classList.toggle('dragover', s.dataset.sec === S.dragOverSection));
  }
});
document.addEventListener('drop', e => {
  const sec = e.target.closest('[data-sec]');
  if (!sec || !S.dragId) return;
  e.preventDefault();
  const t = S.tasks.find(x => x.id === S.dragId);
  if (t && t.sectionId !== sec.dataset.sec) { t.sectionId = sec.dataset.sec; t.flash = true; }
  S.dragId = null; S.dragOverSection = null;
  render();
});

// Drop de ficheros reales sobre las zonas de carga
document.addEventListener('dragover', e => {
  const d = e.target.closest('[data-drop]');
  if (d && !S.dragId) { e.preventDefault(); d.classList.add('over'); }
});
document.addEventListener('dragleave', e => {
  const d = e.target.closest('[data-drop]');
  if (d) d.classList.remove('over');
});
// Selector de fichero nativo (clic en la caja del Excel)
function abrirSelector(key) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = key === 'excel' ? '.xlsx' : '.pdf,.html,.htm';
  inp.multiple = true;   // los dos Excel del mes pueden ir juntos
  inp.multiple = key === 'strategy';
  inp.onchange = async () => {
    if (!inp.files.length) return;
    await añadirFicheros([...inp.files], key);
  };
  inp.click();
}

// El Excel es uno; los documentos de estrategia, los que hagan falta.
async function añadirFicheros(files, key) {
  if (key === 'strategy') {
    for (const file of files) {
      S.files.strategy.push(await API.inspeccionarFichero(file, 'strategy'));
    }
    render();
    return;
  }

  // La caja de Excel acepta los dos del mes a la vez y mira dentro de
  // cada uno para saber cuál es. Nadie tiene por qué acordarse de cuál
  // va dónde, y el que se equivocara recibía cien avisos sin sentido.
  S.avisoExcel = '';
  for (const file of files) {
    const buf = await file.arrayBuffer();
    const cual = API.queExcelEs(buf);
    if (!cual) {
      S.avisoExcel = `"${file.name}" no se parece ni al Excel de campañas ni al de ` +
        `banners. Si es uno de los dos, mira que no le falte la hoja de siempre.`;
      continue;
    }
    S.files[cual] = await API.inspeccionarFichero(file, cual);
  }
  render();
}

document.addEventListener('drop', async e => {
  const d = e.target.closest('[data-drop]');
  if (!d || S.dragId) return;
  e.preventDefault();
  const key = d.dataset.drop;
  if (key === 'excel' && S.files.excel && S.files.banners) return;
  await añadirFicheros([...e.dataTransfer.files], key);
});

// Los catálogos se piden a Asana antes de nada. Si no hay backend,
// se sigue con la copia de data.js y se avisa en la entrada.
// Si la dirección trae un enlace de propuesta, no se pinta la pantalla
// de subir ficheros ni un instante: quien llega por el enlace viene a
// revisar, y ver la pantalla de subida le hace dudar de si va bien.
if (location.hash.length > 1) {
  S.screen = 'cargando';
  render();
  abrirDesdeEnlace().then(ok => { if (!ok) { S.screen = 'entrada'; render(); } });
  API.cargarCatalogos().then(r => { S.catalogos = r; });
} else {
  render();
  API.cargarCatalogos().then(r => { S.catalogos = r; render(); });
}
</script>
